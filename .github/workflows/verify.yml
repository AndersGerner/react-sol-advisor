name: Verify

on:
  push:
    branches: ["main", "feat/*"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run repository verifier
        run: sh plugins/react-sol-advisor/scripts/verify.sh

      - name: Run focused hardening regressions
        run: sh plugins/react-sol-advisor/scripts/verify-hardening.sh

      - name: Run orchestration contract checks
        run: sh plugins/react-sol-advisor/scripts/verify-contracts.sh

      - name: Run Luna exact-thread contract checks
        run: sh plugins/react-sol-advisor/scripts/verify-luna-thread-contracts.sh

      - name: Run TMPDIR portability regressions
        run: sh plugins/react-sol-advisor/scripts/verify-tmpdir-portability.sh

      - name: Run Sol Development Advisor generalization acceptance
        run: sh plugins/react-sol-advisor/scripts/verify-generalization.sh

      - name: Run native role upgrade acceptance
        run: sh plugins/react-sol-advisor/scripts/verify-agent-upgrade.sh

      - name: Check whitespace in the branch change set
        run: git diff --check origin/main...HEAD
