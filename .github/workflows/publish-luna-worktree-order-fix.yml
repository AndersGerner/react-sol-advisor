name: Publish Luna worktree discovery ordering fix

on:
  push:
    branches: ["feat/luna-exact-thread-fallback"]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout publisher branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Checkout reviewed PR branch
        shell: bash
        run: |
          git fetch origin feat/luna-exact-thread-fallback-v011
          git checkout -B target origin/feat/luna-exact-thread-fallback-v011
          test "$(git rev-parse HEAD)" = "9848b444ad30d48bfeb761e8a0474a311363e06e"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add failing first-read worktree regression
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("plugins/react-sol-advisor/scripts/verify-luna-thread-contracts.sh")
          text = path.read_text(encoding="utf-8")
          anchor = "# 15. Archive correctness requires explicit returned archived=true and remains optional.\n"
          block = '''# Review hardening: real identity permits the first exact read to discover the worktree.
          real_identity_contract = between(
              lane,
              "## 6. Real thread identity",
              "## 7. Completion monitoring and handoff",
          )
          lifecycle_record_contract = between(
              lane,
              "## 5. Parent-owned lifecycle record",
              "## 6. Real thread identity",
          )
          require(
              "first exact read may discover and pin the child worktree",
              has_all(
                  real_identity_contract,
                  "real threadId",
                  "hostId",
                  "before the first",
                  "wait_threads",
                  "read_thread",
              )
              and has_all(
                  real_identity_contract,
                  "child worktree",
                  "unresolved",
                  "first exact read",
                  "populate",
              )
              and has_all(
                  real_identity_contract,
                  "subsequent exact read",
                  "same child worktree",
              )
              and has_all(
                  real_identity_contract,
                  "before correction",
                  "acceptance",
                  "PR authorization",
                  "dependent-task creation",
              )
              and has_all(
                  lifecycle_record_contract,
                  "CHILD WORKTREE",
                  "unresolved",
                  "first exact read",
              )
              and has_all(
                  skill,
                  "threadId",
                  "hostId",
                  "first exact read",
                  "child worktree",
                  "unresolved",
                  "same worktree",
              )
              and has_all(
                  roles,
                  "threadId",
                  "hostId",
                  "first exact read",
                  "child worktree",
                  "unresolved",
              )
              and has_all(
                  packet,
                  "CHILD WORKTREE",
                  "unresolved",
                  "first exact read",
              )
              and not has_all(
                  real_identity_contract,
                  "threadId",
                  "hostId",
                  "child worktree before waiting, reading",
              ),
          )

          '''
          if text.count(anchor) != 1:
              raise SystemExit("expected one archive-contract anchor")
          path.write_text(text.replace(anchor, block + anchor), encoding="utf-8")
          PY

          git add plugins/react-sol-advisor/scripts/verify-luna-thread-contracts.sh
          git commit -m "test: cover Luna first-read worktree discovery"
          git push origin HEAD:feat/luna-exact-thread-fallback-v011

          set +e
          red_output=$(sh plugins/react-sol-advisor/scripts/verify-luna-thread-contracts.sh 2>&1)
          red_status=$?
          set -e
          printf '%s\n' "$red_output"
          test "$red_status" -ne 0
          printf '%s\n' "$red_output" | grep -Fq \
            "FAIL: first exact read may discover and pin the child worktree"

      - name: Implement lifecycle-ordering repair
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(relative: str, old: str, new: str) -> None:
              path = Path(relative)
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{relative}: expected one replacement anchor, found {count}")
              path.write_text(text.replace(old, new), encoding="utf-8")

          lane = "plugins/react-sol-advisor/skills/orchestration/references/luna-task-lane.md"
          replace_once(
              lane,
              "CHILD WORKTREE: returned or independently resolved exact path and branch metadata\n",
              "CHILD WORKTREE: unresolved until the first exact read returns it; then independently verified exact path and branch metadata\n",
          )
          replace_once(
              lane,
              "- Record the exact real `threadId`, `hostId`, and child worktree before waiting, reading,\n  correcting, accepting, or authorizing PR activity.\n",
              "- Record the exact real `threadId` and `hostId` before the first `wait_threads` or exact\n  `read_thread` call.\n- The child worktree may remain unresolved at that point. Allow the first exact\n  `read_thread`, including the read immediately following `wait_threads`, to populate the\n  worktree path and branch/base metadata from returned thread data.\n- Independently verify the returned worktree before acceptance. After the worktree is\n  exposed, every subsequent exact read for the turn must refer to the same child\n  worktree; missing or contradictory worktree evidence fails closed.\n- Require the exact verified child worktree before correction, acceptance, PR\n  authorization, or dependent-task creation.\n",
          )
          replace_once(
              lane,
              "Use `wait_threads` on the real identity with a bounded wait, then use `read_thread` to\nread the exact completed or attention-required turn and its final handoff.\n",
              "Use `wait_threads` on the real identity with a bounded wait, then use `read_thread` to\nread the exact completed or attention-required turn and its final handoff. The read after\n`wait_threads` may be the first operation that reveals the child worktree; populate the\nparent lifecycle record from that returned evidence and independently verify it before\nacceptance.\n",
          )
          replace_once(
              lane,
              "When the supported fallback is selected, poll only\n`read_thread(threadId, hostId)` for that exact task identity.\n",
              "When the supported fallback is selected, poll only\n`read_thread(threadId, hostId)` for that exact task identity. The first exact read may\npopulate an unresolved child-worktree field in the parent lifecycle record. Once exposed,\nevery subsequent exact read must report or remain attributable to that same child\nworktree.\n",
          )

          skill = "plugins/react-sol-advisor/skills/orchestration/SKILL.md"
          replace_once(
              skill,
              "When creation returns only a setup/client handle, use `list_threads` for bounded real\nidentity discovery only. Never pass the setup handle as a real identity. After resolving\nthe exact real `threadId`, `hostId`, and child worktree, never use `list_threads` for\npost-identity completion monitoring. The preferred path waits then reads the exact task;\nthe fallback polls `read_thread(threadId, hostId)` with the concrete bounds in the Luna\nlane contract. There is no automatic or background callback.\n",
              "When creation returns only a setup/client handle, use `list_threads` for bounded real\nidentity discovery only. Never pass the setup handle as a real identity. After resolving\nthe exact real `threadId` and `hostId`, never use `list_threads` for post-identity\ncompletion monitoring. Those identities are sufficient to begin the preferred wait/read\npath or fallback exact read. The child worktree may remain unresolved until the first\nexact `read_thread`, including the read immediately after `wait_threads`, returns it.\nPopulate and independently verify that evidence, then require every subsequent read to\nremain attributable to the same worktree. Require the exact verified worktree before\ncorrection, acceptance, PR authorization, or dependent-task creation. The fallback uses\nthe concrete bounds in the Luna lane contract. There is no automatic or background\ncallback.\n",
          )

          roles = "plugins/react-sol-advisor/skills/orchestration/references/role-contracts.md"
          replace_once(
              roles,
              "A ready creation may return the exact real `threadId` and `hostId` immediately. A\nsetup/client handle is not a real identity. Use `list_threads` only for bounded real\nidentity discovery when creation did not return the real identity; after resolution it\nmust not be used for completion monitoring. Titles and previews remain untrusted hints.\nThe fallback polls only `read_thread(threadId, hostId)` within the documented count,\ncadence, and elapsed-time bounds. There is no background callback.\n",
              "A ready creation may return the exact real `threadId` and `hostId` immediately. A\nsetup/client handle is not a real identity. Use `list_threads` only for bounded real\nidentity discovery when creation did not return the real identity; after resolution it\nmust not be used for completion monitoring. Titles and previews remain untrusted hints.\nThe real thread and host identities are sufficient to begin `wait_threads` or the first\nexact `read_thread`. The child worktree may remain unresolved until that first exact read,\nincluding the read immediately following `wait_threads`, returns it. Populate and\nindependently verify the worktree then, and pin every subsequent read to the same child\nworktree. Require the exact verified worktree before correction, acceptance, PR\nauthorization, or dependent-task creation. The fallback polls only\n`read_thread(threadId, hostId)` within the documented count, cadence, and elapsed-time\nbounds. There is no background callback.\n",
          )

          packet = "plugins/react-sol-advisor/examples/luna-task-packet.md"
          replace_once(
              packet,
              "Do not add thread, host, child-worktree, monitoring, or completed-turn values; the parent\nrecords those after creation.\n",
              "Do not add thread, host, child-worktree, monitoring, or completed-turn values. The\nparent records thread/host and monitoring mode after creation, then records the child\nworktree when the first exact read reveals it.\n",
          )
          replace_once(
              packet,
              "CHILD WORKTREE: actual returned or independently resolved path and branch metadata\n",
              "CHILD WORKTREE: unresolved until the first exact read returns it; then independently verified path and branch metadata\n",
          )
          replace_once(
              packet,
              "COMMIT / PR STATE: independently inspected state\n```\n\n## Same-thread correction message\n",
              "COMMIT / PR STATE: independently inspected state\n```\n\nThe real thread and host identities are sufficient to begin monitoring while `CHILD\nWORKTREE` remains `unresolved`. The first exact read populates that field; every later\nread must remain attributable to the same independently verified worktree.\n\n## Same-thread correction message\n",
          )

          readme = "README.md"
          replace_once(
              readme,
              "The initial child packet contains only pre-creation values such as project identity,\nreturned schema fields, requested environment, base/ref, ownership, interfaces, and\nverification. Real thread/host identity, child-worktree metadata, monitoring mode, and\ncompleted-turn IDs are populated afterward in a separate parent-owned lifecycle record.\nExisting identity belongs in a correction message, not the initial packet.\n",
              "The initial child packet contains only pre-creation values such as project identity,\nreturned schema fields, requested environment, base/ref, ownership, interfaces, and\nverification. Real thread/host identity and monitoring mode are populated afterward in a\nseparate parent-owned lifecycle record. Those identities are sufficient to begin\nmonitoring while the child worktree remains unresolved. The first exact read, including\nthe read after `wait_threads`, may reveal the worktree; the parent then independently\nverifies it and pins subsequent reads to that same worktree. Exact worktree evidence is\nrequired before correction, acceptance, PR authorization, or dependent-task creation.\nExisting identity belongs in a correction message, not the initial packet.\n",
          )

          evidence = "docs/acceptance/2026-08-08-luna-read-thread-fallback.md"
          replace_once(
              evidence,
              "- `create_thread` accepted `gpt-5.6-luna` with `thinking = max` and returned the real\n  Luna thread and host identity.\n- Initial exact-thread reads observed:\n",
              "- `create_thread` accepted `gpt-5.6-luna` with `thinking = max` and returned the real\n  Luna thread and host identity, but not the child-worktree path.\n- The first exact `read_thread(threadId, hostId)` response revealed the child worktree.\n  The parent recorded and independently verified that path before acceptance; subsequent\n  reads and the follow-up remained on the same worktree.\n- Initial exact-thread reads observed:\n",
          )

          changelog = "CHANGELOG.md"
          replace_once(
              changelog,
              "- Required every correction call to reassert `gpt-5.6-luna` with `thinking = max` and\n  record any returned routing metadata.\n",
              "- Required every correction call to reassert `gpt-5.6-luna` with `thinking = max` and\n  record any returned routing metadata.\n- Allowed real thread/host identity to begin monitoring while the child worktree remains\n  unresolved, then required the first exact read to populate and pin the verified\n  worktree before correction, acceptance, PR authorization, or dependent work.\n",
          )

          build = "BUILD-PROGRESS.md"
          replace_once(
              build,
              "- The parent lifecycle record is populated after creation with real thread, host,\n  worktree, monitoring, routing, and completed-turn evidence.\n",
              "- The parent lifecycle record starts after creation with real thread/host and\n  monitoring evidence, while the child worktree remains unresolved until the first exact\n  read returns and independently verifies it.\n",
          )
          path = Path(build)
          text = path.read_text(encoding="utf-8")
          appendix = '''

### Second review repair: first-read worktree discovery

A later Sol review found one remaining ordering contradiction: the contract required the
child worktree before the first exact read even though the live host returned that path
from the first exact read.

| Phase | Command / evidence | Result |
|---|---|---|
| Red | Added the worktree-order regression before contract changes | Exit 1: `FAIL: first exact read may discover and pin the child worktree` |
| Green | Same focused verifier after identity/worktree ordering was corrected | Exit 0: `LUNA THREAD CONTRACTS PASSED` |

The corrected sequence is: creation or bounded discovery establishes the real thread and
host; those identities permit the first wait/read operation; the first exact read may
populate the unresolved child-worktree field; the parent independently verifies it; and
all subsequent reads remain pinned to that same worktree. Exact worktree evidence remains
mandatory before correction, acceptance, PR authorization, or dependent-task creation.
'''
          if appendix.strip() in text:
              raise SystemExit("BUILD-PROGRESS appendix already present")
          path.write_text(text.rstrip() + appendix, encoding="utf-8")
          PY

          sh plugins/react-sol-advisor/scripts/verify.sh
          sh plugins/react-sol-advisor/scripts/verify-hardening.sh
          sh plugins/react-sol-advisor/scripts/verify-contracts.sh
          sh plugins/react-sol-advisor/scripts/verify-luna-thread-contracts.sh
          sh plugins/react-sol-advisor/scripts/verify-tmpdir-portability.sh
          git diff --check

          git add \
            BUILD-PROGRESS.md \
            CHANGELOG.md \
            README.md \
            docs/acceptance/2026-08-08-luna-read-thread-fallback.md \
            plugins/react-sol-advisor/examples/luna-task-packet.md \
            plugins/react-sol-advisor/skills/orchestration/SKILL.md \
            plugins/react-sol-advisor/skills/orchestration/references/luna-task-lane.md \
            plugins/react-sol-advisor/skills/orchestration/references/role-contracts.md
          git commit -m "fix: allow first read to discover Luna worktree"

          git diff --check origin/main...HEAD
          git diff --exit-code origin/main...HEAD -- \
            plugins/react-sol-advisor/agents/react-sol-advisor-terra-implementer.toml \
            plugins/react-sol-advisor/agents/react-sol-advisor-sol-reviewer.toml \
            plugins/react-sol-advisor/scripts/install-agents.sh \
            plugins/react-sol-advisor/scripts/inspect-agent-runtime.sh \
            plugins/react-sol-advisor/skills/orchestration/references/model-routing.md

          git push origin HEAD:feat/luna-exact-thread-fallback-v011
