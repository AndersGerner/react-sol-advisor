interface:
  display_name: "Sol Development Advisor Orchestration"
  short_description: "Fast-only Luna-first delivery for React, backend, data, and integrations; escalate to Terra / High and fresh Sol review when needed"
  default_prompt: "Use $orchestration for implementation work. Select mandatory production-delivery plus conditional profiles from delivery-profiles.md using owned paths and acceptance; do not require React for non-React work. Default to economy (green -> Luna / Max / Fast; amber -> Sol decomposition with Luna subparts and Terra core; red -> Terra / High plus fresh Sol review). Require explicit, observable Fast service tier routing for every Luna turn and fail closed if unavailable. Balanced and critical policies are explicit alternatives. Emit a ROUTING DECISION with POLICY, RISK, LANE, OWNERSHIP, DELIVERY PROFILES, ESCALATION TRIGGERS, and PR POLICY before delegating. Historical QUALITY CONTRACT blocks remain compatible records. Do not silently substitute models, lanes, or tools. Optional Linear intake is read-only and never a hard dependency."
