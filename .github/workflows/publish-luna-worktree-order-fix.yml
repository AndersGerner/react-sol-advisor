name: Publish Luna worktree discovery ordering fix

on:
  push:
    branches: ["feat/luna-exact-thread-fallback"]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout publisher branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Publish red-green repair
        run: bash .github/scripts/publish-luna-worktree-order-fix.sh
